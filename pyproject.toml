[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "simtrace2-pysniff"
version = "1.16.1"
description = "Python-based sniffing tool for SIMtrace2 hardware (SIM card communication sniffer)"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.9"
dependencies = [
    "pyusb>=1.2",
]

[project.scripts]
simtrace2-pysniff = "simtrace2_pysniff.__main__:main"
simtrace2-pysniff-server = "simtrace2_pysniff.server.__main__:main"

[tool.setuptools.packages.find]
include = ["simtrace2_pysniff*"]
